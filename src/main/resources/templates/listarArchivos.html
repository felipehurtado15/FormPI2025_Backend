<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Lista de Archivos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <h1 align="center">Archivos Disponibles</h1>

        <table align="center" class="table table-bordered" style="width: 50%" border="1">
            <thead>
                <tr>
                    <th>Nombre del Archivo</th>
                    <th>Tipo</th>
                    <th>Fecha de Creación</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <!-- Iterar sobre la lista de archivos -->
                <tr th:each="archivo : ${archivos}">
                    <td th:text="${archivo.nombre}"></td>
                    <!-- Verificar si el archivo contiene la palabra "master" -->
                    <td th:text="${archivo.nombre.contains('Master') ? 'ARCHIVO PRINCIPAL' : 'ANEXO'}"></td>
                    <td th:text="${archivo.fechaCreacion}"></td>
                    <td>
                        <!-- Enlace de descarga -->
                        <a th:href="@{/descargar/{nombreArchivo}(nombreArchivo=${archivo.nombre})}">Descargar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
