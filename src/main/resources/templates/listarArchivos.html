<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <title>Lista de Archivos</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }

      .archivo-principal {
        background-color: #e6f2ef;
        border-left: 6px solid #005740;
        border-radius: 0.75rem;
        padding: 1.5rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 2rem;
      }

      .archivo-principal h5 {
        color: #005740;
        font-weight: bold;
      }

      .archivo-principal i {
        color: #005740;
        margin-right: 0.5rem;
      }

      .btn-primary-custom {
        background-color: #005740;
        border-color: #005740;
        color: white;
      }

      .btn-primary-custom:hover {
        background-color: #004030;
        border-color: #004030;
      }

      .table-header-verde {
        background-color: #005740 !important;
        color: white;
      }
    </style>
  </head>
  <body class="container py-5">
    <h1 class="text-center mb-4">Archivos Disponibles</h1>

    <!-- Sección: Archivo Principal -->
    <div th:if="${#lists.contains(archivos.![nombre.contains('Master')], true)}">
      <div
        class="archivo-principal"
        th:each="archivo : ${archivos}"
        th:if="${archivo.nombre.contains('Master')}"
      >
        <h5>
          <i class="bi bi-star-fill"></i> Archivo Principal
        </h5>
        <p class="mb-1">
          <strong>Fecha:</strong> <span th:text="${archivo.fechaCreacion}">2025-05-22</span>
        </p>
        <p class="mb-3">
          <strong>Nombre Archivo:</strong> <span th:text="${archivo.nombre}">archivo-master.xlsx</span>
        </p>
        <a
          class="btn btn-primary-custom"
          th:href="@{/descargar/{nombreArchivo}(nombreArchivo=${archivo.nombre})}"
          >Descargar</a
        >
      </div>
    </div>

    <!-- Sección: Anexos -->
    <div>
      <h4 class="text-secondary mt-5">Anexos</h4>
      <table class="table table-striped table-bordered">
        <thead class="table-header-verde">
          <tr>
            <th>NIT</th>
            <th>Nombre Organización</th>
            <th>Nombre Postulante</th>
            <th>Fecha</th>
            <th>Documento</th>
          </tr>
        </thead>
        <tbody>
          <tr
            th:each="archivo : ${archivos}"
            th:if="${!archivo.nombre.contains('Master')}"
          >
            <td th:text="${archivo.nit}">123456789</td>
            <td th:text="${archivo.organizacion}">Organización</td>
            <td th:text="${archivo.postulante}">Postulante</td>
            <td th:text="${archivo.fechaCreacion}">2025-05-22</td>
            <td>
              <a
                class="btn btn-sm btn-outline-secondary"
                th:href="@{/descargar/{nombreArchivo}(nombreArchivo=${archivo.nombre})}"
                >Descargar</a
              >
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Bootstrap icons (para el ícono en el archivo principal) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.js"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    />
  </body>
</html>
