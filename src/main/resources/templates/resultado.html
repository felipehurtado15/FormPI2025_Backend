<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <link rel="icon" href="data:,">
    <title>Formulario Premios Inclusión 2025</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f5f5f5;
        font-family: 'Segoe UI', sans-serif;
      }

      .card-success {
        border: none;
        background-color: #e6f2ef;
        border-left: 6px solid #005740;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
      }

      .card-success .card-title {
        color: #005740;
        font-weight: bold;
        font-size: 1.8rem;
      }

      .card-success .card-text {
        color: #333;
        font-size: 1.1rem;
      }

      .btn-principal {
        background-color: #005740;
        color: white;
        font-weight: bold;
        border-radius: 50px;
        padding: 10px 25px;
        text-transform: uppercase;
        transition: all 0.3s ease;
        text-decoration: none;
      }

      .btn-principal:hover {
        background-color: #004030;
        color: white;
      }

      .center-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="container center-content">
      <div class="card card-success p-4 mb-4">
        <div class="card-body">
          <h5 class="card-title">¡Gracias!</h5>
          <p class="card-text">Se ha registrado correctamente el formulario.</p>
        </div>
      </div>

      <a href="https://www.comfenalcoantioquia.com.co/" class="btn-principal mt-3">
        Ir a Página Principal
      </a>
    </div>
  </body>
</html>
