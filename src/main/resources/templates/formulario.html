            });
            document.getElementById('comSI').addEventListener('change', function () {
                document.getElementById('comunicacionesInfo').classList.remove('d-none');
            });
            document.getElementById('comNO').addEventListener('change', function () {
                document.getElementById('comunicacionesInfo').classList.add('d-none');
            });
            const selectSector = document.getElementById("sector");
            const otroSectorContainer = document.getElementById("otroSectorContainer");

            selectSector.addEventListener("change", function () {
                if (this.value === "Otro") {
                    otroSectorContainer.classList.remove("d-none");
                } else {
                    otroSectorContainer.classList.add("d-none");
                    document.getElementById("otroSector").value = "";
                }
            });
            document.getElementById('comSI').addEventListener('change', function () {
                document.getElementById('comunicacionesInfo').classList.remove('d-none');
            });
            document.getElementById('comNO').addEventListener('change', function () {
                document.getElementById('comunicacionesInfo').classList.add('d-none');
            });
            document.getElementById('reconocidaSI').addEventListener('change', function () {
                document.getElementById('detalleReconocimiento').classList.remove('d-none');
            });
            document.getElementById('reconocidaNO').addEventListener('change', function () {
                document.getElementById('detalleReconocimiento').classList.add('d-none');
            });
            document.getElementById('categoria').addEventListener('change', function () {
                var seleccion = this.value;
                var campo = document.getElementById('grupoPersonas');

                if (seleccion === 'Inclusión Social o Educativa') {
                    campo.style.display = 'block';
                    campo.querySelector('input').setAttribute('required', 'required');
                } else {
                    campo.style.display = 'none';
                    campo.querySelector('input').removeAttribute('required');
                }
            });
            (function () {
                'use strict'

                // Fetch all the forms we want to apply custom Bootstrap validation styles to
                var forms = document.querySelectorAll('.needs-validation')

                // Loop over them and prevent submission
                Array.prototype.slice.call(forms)
                        .forEach(function (form) {
                            form.addEventListener('submit', function (event) {
                                if (!form.checkValidity()) {
                                    event.preventDefault()
                                    event.stopPropagation()
                                }

                                form.classList.add('was-validated')
                            }, false)
                        })
            })()

        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
